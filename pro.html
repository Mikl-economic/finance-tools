<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>PRO — Калькулятор позиций</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 1000px; margin: 20px auto; padding: 0 15px; color: #24292e; background: #f6f8fa; }
        h1 { text-align: center; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #586069; margin-bottom: 25px; font-size: 0.9em; }

        label { display: block; margin-top: 10px; font-weight: 600; font-size: 13px; }
        input, select { width: 100%; padding: 9px; margin-top: 5px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        .row { display: flex; gap: 10px; }
        .col { flex: 1; }
        .row-head { display: flex; gap: 10px; align-items: center; margin-bottom: 4px; }
        .row-head .p-name { flex: 1; font-weight: 600; }
        .del-btn { background: #ffebe9; color: #d73a49; border: none; border-radius: 6px; width: 34px; height: 36px; font-size: 18px; cursor: pointer; }
        .del-btn:hover { background: #ffd6d3; }
        .pos-card { border-left: 3px solid #7c3aed; }
        .row-res { margin-top: 12px; border-top: 1px dashed #e1e4e8; padding-top: 6px; }
        .result-item { display: flex; justify-content: space-between; padding: 4px 0; font-size: 14px; }
        .result-label { color: #586069; }
        .result-value { font-weight: 700; }
        .pos { color: #22863a; }
        .neg { color: #d73a49; }
        .add-btn { width: 100%; padding: 12px; background: #fff; color: #7c3aed; border: 2px dashed #7c3aed; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 15px; margin-bottom: 15px; }
        .add-btn:hover { background: #f5f0ff; }
        .layout { display: flex; gap: 15px; align-items: flex-start; }
        .main-col { flex: 1; min-width: 0; }
        .side-col { width: 320px; flex-shrink: 0; position: sticky; top: 15px; }
